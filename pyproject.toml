[project]
name = "load-testing"
version = "0.1.0"
description = "Load testing of the parcel_delivery MySQL database: Locust + PyMySQL load generator and monitoring stack"
requires-python = ">=3.12"
dependencies = [
    "PyMySQL[rsa]>=1.1",
    "faker>=40.40",
    "gevent>=26.9",
    "locust>=2.46",
    "prometheus-client>=0.21",
    "psutil>=6.0",
]

[tool.uv]
package = false
